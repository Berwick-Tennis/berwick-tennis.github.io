<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berwick Tennis Club — Saturday PM</title>
  <link rel="stylesheet" href="style.css?v=202610281200">
</head>
<body>
  <header>
    <h1>🎾 Berwick Tennis Club</h1>
    <div class="sub" id="hub-sub">Saturday PM</div>
    <div class="updated" id="last-updated">Results loaded: —</div>
  </header>

  <nav>
    <button class="active" data-tab="week">This Round</button>
    <button data-tab="ladders">Teams</button>
    <button data-tab="emergency">Emergencies</button>
    <button data-tab="people">Players</button>
  </nav>

  <main>
    <section id="week" class="tab active">
      <h2 id="week-title" style="margin-top:0;">This round</h2>
      <div id="this-week">Loading…</div>
    </section>

    <section id="ladders" class="tab">
      <div class="card">
        <h2>Berwick teams — ladder positions</h2>
        <div id="ladders-table">Loading…</div>
      </div>
    </section>

    <section id="emergency" class="tab">
      <div class="card">
        <h2>Emergency tracker</h2>
        <div id="emergencies">Loading…</div>
      </div>
    </section>

    <section id="people" class="tab">
      <div class="card">
        <h2>Club players</h2>
        <div id="club-players">Loading…</div>
      </div>
    </section>
  </main>

  <footer>
    Berwick Tennis Club &middot; Data from <a href="https://www.trols.org.au/wdta/results.php" target="_blank" rel="noopener">trols.org.au</a> &middot; Updated weekly (Wednesdays)<br>
    Past seasons: <span id="archives"></span>
  </footer>

  <script src="club.js?v=202610281200"></script>
  <script src="hub.js?v=202610281200"></script>
</body>
</html>
